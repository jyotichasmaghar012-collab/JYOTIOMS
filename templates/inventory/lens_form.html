{% extends "base.html" %}
{% block title %}{{ 'Edit Lens' if lens else 'Add Lens' }}{% endblock %}
{% block content %}
<div class="page-header"><h1>{{ 'Edit Lens' if lens else 'Add Lens' }}</h1></div>
<div class="panel form-panel">
<form method="POST" data-ajax-save>
  {% if branches is not none %}
  <label>Branch *</label>
  <select name="branch_id" required>
    <option value="">-- Select Branch --</option>
    {% for b in branches %}
    <option value="{{ b['id'] }}" {{ 'selected' if default_branch_id == b['id'] else '' }}>{{ b['name'] }}</option>
    {% endfor %}
  </select>
  {% endif %}
  <label>Lens Type * (e.g. Single Vision, Bifocal, Progressive)</label>
  <input type="text" name="lens_type" required value="{{ lens['lens_type'] if lens else '' }}">
  <label>Material (e.g. CR-39, Polycarbonate, High Index)</label>
  <input type="text" name="material" value="{{ lens['material'] if lens else '' }}">
  <label>Brand</label>
  <input type="text" name="brand" value="{{ lens['brand'] if lens else '' }}">
  <label>Selling Price *</label>
  <input type="number" step="0.01" name="selling_price" required value="{{ lens['selling_price'] if lens else 0 }}">
  <div class="form-row">
    <div>
      <label>Stock Quantity</label>
      <input type="number" name="stock_qty" value="{{ lens['stock_qty'] if lens else 0 }}">
    </div>
    <div>
      <label>Low Stock Alert Threshold</label>
      <input type="number" name="low_stock_threshold" value="{{ lens['low_stock_threshold'] if lens else 2 }}">
    </div>
  </div>
  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('inventory.lenses_index') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
