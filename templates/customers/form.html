{% extends "base.html" %}
{% block title %}{{ 'Edit Customer' if customer else 'New Customer' }}{% endblock %}
{% block content %}
<div class="page-header">
  <h1>{{ 'Edit Customer' if customer else 'New Customer' }}</h1>
</div>
<div class="panel form-panel">
<form method="POST" data-ajax-save>
  <label>Name *</label>
  <input type="text" name="name" required value="{{ customer['name'] if customer else '' }}">

  <label>Phone</label>
  <input type="text" name="phone" value="{{ customer['phone'] if customer else '' }}">

  <label>Email</label>
  <input type="email" name="email" value="{{ customer['email'] if customer else '' }}">

  <label>Address</label>
  <textarea name="address" rows="2">{{ customer['address'] if customer else '' }}</textarea>

  <label>Notes</label>
  <textarea name="notes" rows="2">{{ customer['notes'] if customer else '' }}</textarea>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{{ url_for('customers.index') }}" class="btn btn-secondary">Cancel</a>
  </div>
</form>
</div>
{% endblock %}
